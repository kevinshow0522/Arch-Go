function mainlineCard(){var m=mainline();return '<section class="card"><div class="cardhead"><h2>设计主线</h2>'+pill(m?.version||'尚未建立')+'</div>'+(m?'<p class="lead">'+esc(m.concept||m.one_sentence||'理念尚未记录')+'</p>':empty('各章结论确认后，在对话中逐步形成主线卡。'))+chain()+'</section>';}
function handoffList(values){return values.length?'<div class="timeline">'+values.map(function(h){return '<article class="handoff"><div class="who">'+esc(person(h.from))+' → '+esc(person(h.to))+' · <span class="code">'+esc(h.work_package||'工作包未记录')+'</span>'+(h.at?' · '+esc(time(h.at)):'')+'</div><p class="key">'+esc(h.done||h.summary||'交接内容未记录')+'</p>'+(h.next?'<p class="next">下一步 · '+esc(h.next)+'</p>':'')+(arr(h.waiting_on_user).length?'<p class="waiting">等你 · '+esc(h.waiting_on_user.map(txt).join('；'))+'</p>':'')+(arr(h.files).length?'<div class="files">'+h.files.map(esc).join('<br>')+'</div>':'')+'</article>';}).join('')+'</div>':empty('还没有交接记录。工作包停手时由执行者保存。');}
function taskRows(values,showQuestions){return values.length?values.map(function(t){var state=t.external?(t.externalRead?'外部已有 · 已核读':'外部已有 · 待核读'):t.confirmed?'✓ 已确认':LABEL[t.status]||t.status||'未记录';return '<div class="row"><div class="rowbody"><button class="rowbutton" type="button" data-act="open-task" data-id="'+esc(t.id)+'"><div class="rowtitle">'+esc(t.title)+'</div><div class="rowmeta">'+(t.work_package?'<span class="code">'+esc(t.work_package)+'</span>':'')+pill(state,t.status==='needs_review'?'warn':t.confirmed?'good':'')+pill(person(t.executor))+(t.credibility?pill(t.credibility):'')+(t.caseGrade?pill('案例 '+t.caseGrade):'')+'</div></button>'+(t.checkpoint?.next?'<p class="muted" style="margin-top:9px">下一步 · '+esc(t.checkpoint.next)+'</p>':'')+(showQuestions&&t.questions.length?'<p class="waiting">'+esc(t.questions.map(txt).join('；'))+'</p>':'')+(S.detail===t.id?taskDetail(t):'')+'</div></div>';}).join(''):empty('暂无记录。');}
function taskDetail(t){return '<div class="taskdetails"><h3>工作目标</h3><p>'+esc(t.instruction||'未记录')+'</p>'+(t.result?'<h3>最新成果 · 第 '+esc(t.revision||t.result_revision||0)+' 版</h3><p>'+esc(t.result.narrative||t.result.title||'')+'</p>':'')+(arr(t.review_reasons).length?'<h3>待复核</h3><ul>'+t.review_reasons.map(function(v){return '<li>'+esc(txt(v))+'</li>';}).join('')+'</ul>':'')+(arr(t.questions).length?'<h3>等你回复</h3><ul>'+t.questions.map(function(v){return '<li>'+esc(txt(v))+'</li>';}).join('')+'</ul>':'')+(arr(t.checkpoint?.checks).length?'<h3>已记录的检查</h3><ul>'+t.checkpoint.checks.map(function(v){return '<li>'+esc(txt(v))+'</li>';}).join('')+'</ul>':'')+'</div>';}
function overviewStats(){var all=tasks(),doing=all.filter(function(t){return ['in_progress','message_accepted'].includes(t.status);}),waiting=all.filter(function(t){return ['waiting_decision','waiting_material'].includes(t.status)||t.questions.length;}),review=all.filter(function(t){return t.status==='needs_review';}),done=all.filter(function(t){return t.status==='completed';});return '<div class="stats">'+[[doing.length,'正在推进'],[waiting.length,'等待回复'],[review.length,'需要复核'],[done.length,'已检查完成']].map(function(s){return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>';}).join('')+'</div>';}
function overview(){var all=tasks(),doing=all.filter(function(t){return ['in_progress','message_accepted'].includes(t.status);}),waiting=all.filter(function(t){return ['waiting_decision','waiting_material'].includes(t.status)||t.questions.length;}),review=all.filter(function(t){return t.status==='needs_review';});return '<div class="layout"><div class="stack">'+mainlineCard()+'<section class="card"><div class="cardhead"><h2>现在的工作</h2><span class="muted">'+all.length+' 项实际任务</span></div>'+taskRows(doing.concat(review).slice(0,6))+'</section></div><aside class="stack col-side"><section class="card"><div class="cardhead"><h2>最近交接</h2><span class="muted">最近 3 条</span></div>'+handoffList(handoffs().slice(0,3))+'</section>'+catalogOverview()+'<section class="card"><div class="cardhead"><h2 id="h-wait">等你回复</h2></div>'+taskRows(waiting.slice(0,4),true)+'</section></aside></div>';}
function catalogOverview(){var c=catalog();return '<section class="card"><div class="cardhead"><h2 id="h-stage">项目目录进展</h2></div>'+(c.hasCatalog?arr(c.chapters).map(function(ch){return '<p>'+esc(ch.num+' '+ch.title)+'</p>';}).join(''):empty('尚未整理项目目录'))+'</section>';}
function packagesView(){var all=tasks(),groups={};all.forEach(function(t){var ch=t.topics[0]?.split('.')[0]||(/^W(\d)/.exec(t.work_package||'')?.[1]||'其他').padStart(2,'0'),key=ch+'|'+(t.work_package||'未编号工作包');(groups[key]||(groups[key]=[])).push(t);});return all.length?'<div class="stack">'+Object.keys(groups).sort().map(function(key){var parts=key.split('|'),chapter=arr(METHOD.chapters).find(function(c){return c.number===parts[0];}),pkg=arr(METHOD.work_packages).find(function(p){return p.id===parts[1];});return '<section class="card"><div class="cardhead"><h2><span class="code">'+esc(parts[1])+'</span> '+esc(pkg?.title||chapter?.title||'项目工作')+'</h2><span class="muted">'+esc(chapter?.number||'')+' '+esc(chapter?.title||'')+'</span></div>'+taskRows(groups[key])+'</section>';}).join('')+'</div>':'<section class="card">'+empty('本项目尚未建立工作包。工作包由 AI 在对话中按项目需要组织。')+'</section>';}
function directoryView(){var c=catalog(),all=tasks(),ss=summaries();return '<section class="card directory" data-project-catalog><div class="cardhead"><h2>本项目目录</h2><span class="muted">'+(c.hasCatalog?'第 '+esc(c.catalogVersion)+' 版':'尚未建立')+'</span></div>'+arr(c.warnings).map(function(w){return '<p class="notice">'+esc(w)+'</p>';}).join('')+(c.hasCatalog?c.chapters.map(function(ch){return '<details open><summary>'+esc(ch.num+' '+ch.title)+'</summary>'+ch.items.map(function(item){var linked=all.filter(function(t){return t.topics.includes(item.id);}),status=linked.some(function(t){return t.confirmed;})?'✓ 已确认':linked.some(function(t){return t.hasResult;})?'● 有成果':linked.length?'◐ 进行中':'○ 未涉及';return '<div class="item" data-project-item="'+esc(item.id)+'" data-item-state="'+esc(c.itemStates[item.id]||'none')+'" data-counted="'+String(item.counted)+'" data-requirement="'+({c:'core',o:'optional',k:'keep',s:'skip'}[item.req]||'optional')+'"><span class="itemid">'+esc(item.id)+'</span>'+esc(item.title)+'<div class="rowmeta">'+pill(item.requirement||'按需')+pill(status)+(linked.some(function(t){return t.external;})?pill('外部已有'):'')+linked.map(function(t){return pill(person(t.executor))+(t.subproject?pill('子项 '+t.scopeDepth+' '+(METHOD.service_stages[t.scopeDepth]||'')):'');}).join('')+(item.end?pill('章末'):'')+'</div></div>';}).join('')+'</details>';}).join(''):empty('尚未整理项目目录。当前只显示实际任务，默认方法目录在下方供查阅。')+taskRows(all))+(arr(c.backfill).length?'<div class="sectiongap"><h3>进入阶段补齐</h3>'+c.backfill.map(function(item){return '<p class="muted" data-backfill-method="'+esc(item.method)+'">'+esc(item.method+' '+item.title)+' · 待补齐</p>';}).join('')+'</div>':'')+'</section><section class="card sectiongap"><div class="cardhead"><h2>章末结论</h2><span class="muted">最新有效摘要</span></div>'+(ss.length?ss.map(function(s){return '<article class="row"><div class="rowbody"><h3><span class="itemid">'+esc(s.item)+'</span>'+esc(titleOf(s.item))+'</h3><p style="margin-top:10px">'+esc(s.summary)+'</p><div class="rowmeta">'+pill(s.status||'待确认',s.status==='已确认'?'good':'')+(s.mainline_ref?pill(s.mainline_ref):'')+'</div>'+(s.ids?'<p class="source">产生编号 · '+esc(txt(s.ids))+'</p>':'')+(arr(s.open_questions).length?'<p class="waiting">待定 · '+esc(s.open_questions.map(txt).join('；'))+'</p>':'')+'</div></article>';}).join(''):empty('还没有章末摘要。各章结束时在对话中保存并同步。'))+'</section>'+methodReference();}
function methodReference(){return '<details class="card method-reference" data-method-reference><summary>方法 '+esc(METHOD.method_version)+' 默认目录（参考）</summary><div class="muted">项目目录按实际委托讨论调整。表列核心与章末补做分别统计。</div><div class="badgebar">'+Object.keys(METHOD.declared_core_by_stage||{}).map(function(stage){return pill(stage+'：表列 '+METHOD.declared_core_by_stage[stage].length+' / 必做 '+arr(METHOD.core_by_stage[stage]).length);}).join('')+'</div>'+arr(METHOD.chapters).map(function(ch){return '<div><h3>'+esc(ch.number+' '+ch.title)+'</h3>'+arr(METHOD.work_packages).filter(function(p){return p.chapter===ch.number;}).map(function(p){return '<p class="muted"><span class="code">'+esc(p.id)+'</span> '+esc(p.title)+' · '+esc(p.items.join('、'))+' · '+esc(p.stage_note)+'</p>';}).join('')+'</div>';}).join('')+'</details>';}
function itemList(title,values){return '<div class="sectionlist"><h3>'+esc(title)+'</h3>'+(values.length?values.map(function(v){var sources=v&&typeof v==='object'?v.source||v.sources||v.from||v.responds||v.responds_to:[];return '<div class="listline">'+(v?.id?'<b class="code">'+esc(v.id)+'</b>':'')+esc(txt(v))+(sources&&(Array.isArray(sources)?sources.length:true)?'<p class="source">关联来源 · '+esc(Array.isArray(sources)?sources.map(txt).join('、'):txt(sources))+'</p>':'')+'</div>';}).join(''):empty('未记录'))+'</div>';}
function mainlineView(){var m=mainline(),metricsValue=metrics(),labels=['指标','数值','口径','性质','来源等级','状态','影响条目'];return '<div class="stack">'+mainlineCard()+(m?'<section class="card">'+itemList('关键矛盾',arr(m.conflicts))+itemList('设计策略',arr(m.strategies))+itemList('待定事项',arr(m.pending))+'</section>':'')+'<section class="card"><div class="cardhead"><h2>项目指标表</h2>'+pill(metricsValue?.version||'尚未建立')+'</div>'+(arr(metricsValue?.rows).length?'<div class="tablewrap"><table data-metrics><thead><tr>'+labels.map(function(v){return '<th scope="col">'+esc(v)+'</th>';}).join('')+'</tr></thead><tbody>'+metricsValue.rows.map(function(r){var values=[r.name,[r.value,r.unit].filter(function(v){return v!==undefined&&v!==null;}).join(' '),r.caliber,r.nature||r.type,r.source_grade,[r.credibility,r.status].filter(Boolean).join(' '),arr(r.affected_items||r.items).map(txt).join('、')];return '<tr>'+values.map(function(v,i){return '<td data-label="'+labels[i]+'">'+esc(v===undefined||v===null||v===''?'未记录':v)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>':empty('指标表由 AI 根据已确认来源在对话中维护，这里只查看。'))+'</section></div>';}

function cloudPublicationNote(){var p=S.snapshot?.publication;return p?'<section class="cloud-note" role="status"><b>云端已保存 · 第 '+esc(p.revision)+' 次发布</b><span>来源更新 '+esc(new Date(p.source_updated_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}))+' · 发布 '+esc(new Date(p.published_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}))+'</span><small>显示最近一次已发布记录。AI在对话中更新，页面每20秒读取一次。</small></section>':'';}
function cloudArtifactCards(){var files=arr(S.snapshot?.artifacts),results=tasks().filter(function(t){return t.hasResult;});return '<div class="stack">'+(results.length?'<section class="card"><div class="cardhead"><h2>已记录的文字成果</h2></div>'+taskRows(results)+'</section>':'')+'<section class="card"><div class="cardhead"><h2>展示成果</h2><span class="muted">'+files.length+' 份云端文件</span></div>'+(files.length?'<div class="artifact-grid">'+files.map(function(f){var url='/api/artifacts/'+encodeURIComponent(f.id),image=/^image\/(png|jpeg|webp|gif)$/.test(f.mime_type);return '<article class="artifact"><h3>'+esc(f.title)+'</h3><p class="muted">'+esc(f.file_name)+(f.result_revision?' · 成果第 '+esc(f.result_revision)+' 版':'')+'</p>'+(image?'<a target="_blank" rel="noopener" href="'+url+'"><img loading="lazy" src="'+url+'" alt="'+esc(f.title)+'"></a>':'')+(f.mime_type==='application/pdf'?'<object class="pdf-preview" data="'+url+'" type="application/pdf"><p>点下方链接查看PDF。</p></object>':'')+'<a class="artifact-link" target="_blank" rel="noopener" href="'+url+'">'+(image||f.mime_type==='application/pdf'?'打开成果':'下载成果')+'</a></article>';}).join('')+'</div>':empty('选定的图纸、图片或文档由AI在对话中发布到这里。'))+'</section></div>';}

function projectButtons(){return '<div class="projects">'+arr(S.snapshot?.projects).map(function(p){return '<button class="projectbtn" type="button" data-act="project" data-id="'+esc(p.id)+'" aria-label="切换到 '+esc(p.name)+'" aria-pressed="'+(p.id===S.snapshot?.publication?.source_key)+'"'+(W.KIGAGA_OFFLINE&&p.id!==S.snapshot?.project?.id?' disabled':'')+'>'+esc(p.name)+'</button>';}).join('')+'</div>';}
function render(){
 var focus=D.activeElement?.getAttribute('data-k'),p=S.snapshot?.project,c=catalog(),service=S.snapshot?.method_version||S.snapshot?.connection?.method_version,recorded=p?.recorded_method_version??p?.method_version??null;
 D.documentElement.dataset.theme=S.theme;
 var header='<header class="top"><div class="shell"><div class="topline"><div class="brand"><span class="mark" aria-hidden="true"><svg class="ic" width="27" height="27" viewBox="0 0 24 24"><path d="M2.5 19.5c5.5-.6 11.5-2.8 19-7M6 18.2V10.4l5.2-3.7 5.3 3.7v5.4M9.8 17.6v-4h3v3.1"/></svg></span><div><b>KI建筑设计工作流</b><small>工作流程 · 只读查看</small></div></div><div class="meta">'+pill('方法 '+METHOD.method_version,'method-badge')+pill(W.KIGAGA_OFFLINE?'离线快照':S.status==='connecting'?'正在连接':'云端工作台')+'<button class="plain" type="button" data-act="projects" data-k="projects">项目</button><button class="plain" type="button" data-act="theme" data-k="theme" aria-label="切换'+(S.theme==='dark'?'浅色':'深色')+'主题">'+(S.theme==='dark'?'浅色':'深色')+'</button></div></div><nav class="tabs" aria-label="视图">'+VIEWS.map(function(v){return '<button class="tab" type="button" data-act="view" data-v="'+v[0]+'" data-k="view-'+v[0]+'"'+(S.view===v[0]?' aria-current="page"':'')+'>'+navIcon(v[0])+'<span class="nav-label">'+v[1]+'</span></button>';}).join('')+'</nav></div></header>';
 var notices=(!service&&S.status==='ready'&&!W.KIGAGA_OFFLINE?'<p class="notice" role="status">服务尚未报告方法版本，请重新连接项目服务后查看新流程。</p>':'')+(service&&service!==METHOD.method_version?'<p class="notice" role="alert">工作台需要重建：服务方法 '+esc(service)+'，页面方法 '+esc(METHOD.method_version)+'。</p>':'')+(S.error?'<p class="notice" role="status">'+esc(S.error)+'</p>':'')+(S.progress?.error&&!W.KIGAGA_OFFLINE?'<p class="notice" role="status">'+esc(S.progress.error)+'</p>':'');
 var content=!p?'<div class="loading">'+(S.status==='connecting'?'正在读取项目工作流程…':'尚未关联项目。请在对话中指定要查看的项目。')+'</div>':S.view==='overview'?overview():S.view==='results'?packagesView():S.view==='method'?directoryView():S.view==='artifacts'?cloudArtifactCards():S.view==='mainline'?mainlineView():'<section class="card"><div class="cardhead"><h2>交接记录</h2><span class="muted">最近 10 条</span></div>'+handoffList(handoffs())+'</section>';
 var heading=(p?'<section class="heading"><div><p class="eyebrow">'+esc(VIEWS.find(function(v){return v[0]===S.view;})?.[1]||'项目工作')+'</p><h1>'+esc(p.name)+'</h1><p class="subtitle">'+esc(c.summary||p.summary||'项目概况尚未记录')+'</p><div class="badgebar">'+pill(recorded?'项目方法 '+recorded:'项目方法未记录')+pill(c.serviceDepth?'服务深度 '+c.serviceDepth+' · '+(METHOD.service_stages[c.serviceDepth]||''):'阶段未记录')+(c.hasCatalog?pill('项目必做 '+c.coreResults+' / '+c.coreTotal+' 项有成果或核读依据'):'')+'</div></div></section>':'');
 var mainContent=p&&S.view==='overview'?'<section class="project-hero">'+heading+overviewStats()+'</section>'+content:heading+content;
 A.innerHTML=header+'<main class="shell page">'+notices+cloudPublicationNote()+(S.projectsOpen?projectButtons():'')+mainContent+'</main><footer class="shell"><span>项目内容、修改和确认请在对话中完成。</span><span>ki-arch · 方法 '+esc(METHOD.method_version)+' · 界面 0.6.1</span></footer>';
 if(focus){var el=Array.from(D.querySelectorAll('[data-k]')).find(function(n){return n.getAttribute('data-k')===focus;});el?.focus({preventScroll:true});}
}
A.addEventListener('click',function(event){var button=event.target.closest('button[data-act]');if(!button||button.disabled)return;var act=button.dataset.act;
 if(act==='view'){S.view=button.dataset.v;S.detail=null;write('ki-arch.view',S.view);}
 else if(act==='theme'){S.theme=S.theme==='dark'?'light':'dark';write('ki-arch.theme',S.theme);}
 else if(act==='projects')S.projectsOpen=!S.projectsOpen;
 else if(act==='open-task')S.detail=S.detail===button.dataset.id?null:button.dataset.id;
 else if(act==='project'){S.projectsOpen=false;Promise.resolve(S.handlers.selectProject?.(button.dataset.id)).catch(function(e){W.KiGAGAWorkbench.setStatus('error',e.message||'项目读取失败');});}
 render();
});
W.KiGAGAWorkbench={
 setSnapshot:function(snapshot,options){var changed=S.snapshot?.project?.id!==snapshot?.project?.id;S.snapshot=snapshot;S.origin=W.KIGAGA_OFFLINE?'offline':options?.origin||'live';S.status='ready';S.error='';if(changed){S.progress=null;S.detail=null;}render();},
 setStatus:function(status,message){S.status=status;S.error=status==='error'?message||'项目服务暂不可用':'';render();},
 setProgress:function(state){if(state?.projectId!==S.snapshot?.project?.id)return;S.progress=state;render();},
 setHandlers:function(handlers){S.handlers=handlers||{};},
 getState:function(){var c=catalog();return {view:S.view,project:S.snapshot?.project?.name||'',projectId:S.snapshot?.project?.id||null,origin:S.origin,tasks:tasks().length,methodVersion:METHOD.method_version,serviceDepth:c.serviceDepth,entryStage:c.entryStage,catalogVersion:c.catalogVersion,hasProjectCatalog:c.hasCatalog,coreTotal:c.coreTotal,coreResults:c.coreResults,palette:S.theme};},
 isReadOnly:true
};
if(W.__KIGAGA_SNAPSHOT__)W.KiGAGAWorkbench.setSnapshot(W.__KIGAGA_SNAPSHOT__,{origin:'offline'});else render();
})();
</script>
